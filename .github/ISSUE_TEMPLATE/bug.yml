name: Bug report
description: Something gives a wrong result or fails.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: code
    attributes:
      label: Code to reproduce
      description: The smallest program that shows it. Attach the image if it matters.
      render: go

  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: v1.0.1
    validations:
      required: true

  - type: input
    id: go
    attributes:
      label: Output of go version
      placeholder: go version go1.27.3 linux/arm64
    validations:
      required: true
